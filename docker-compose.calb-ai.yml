# WeKnora 生产部署 — 从阿里云 ACR 拉取镜像（calb_ai/weknora）
#
# 前置条件（首次 docker compose up 之前必须满足，否则 Docker 会把缺失路径建成目录导致挂载失败）：
#   1. docker login crpi-o8kn58wjl072akln.cn-hangzhou.personal.cr.aliyuncs.com
#   2. .env 已配置
#   3. config/config.yaml 必须是普通文件：test -f config/config.yaml
#   4. docker/searxng/settings.yml 必须是普通文件：test -f docker/searxng/settings.yml
#   5. skills/preloaded/ 等目录随仓库一并部署
#   6. 可选：misc/dex-config.yaml（启用 dex 时）
#   7. 洞鉴 SSO：宿主机私钥文件 /data/secrets/dongjian_rsa_private.pem（启用 DONGJIAN_SSO 时）
#
# 启动：
#   docker compose -f docker-compose.calb-ai.yml up -d
#
# 镜像前缀可通过 .env 覆盖：
#   ACR_IMAGE_PREFIX=crpi-o8kn58wjl072akln.cn-hangzhou.personal.cr.aliyuncs.com/calb_ai/weknora
#   WEKNORA_VERSION=v0.8.2
#
# 所有服务默认 platform: linux/amd64（与 x86 服务器部署一致）
name: weknora-calb-ai
services:
  frontend:
    image: ${ACR_IMAGE_PREFIX:-crpi-o8kn58wjl072akln.cn-hangzhou.personal.cr.aliyuncs.com/calb_ai/weknora}:ui-${WEKNORA_VERSION:-v0.8.2}
    container_name: WeKnora-frontend
    ports:
    - ${FRONTEND_PORT:-80}:80
    environment:
    - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
    - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
    - DEFAULT_LOCALE=${DEFAULT_LOCALE:-}
    - APP_HOST=${APP_HOST:-app}
    - APP_PORT=${APP_BACKEND_PORT:-8080}
    - APP_SCHEME=${APP_SCHEME:-http}
    - FRONTEND_BASE_PATH=${FRONTEND_BASE_PATH:-}
    # ACR UI from push_acr_changes may ship /docker-entrypoint.sh without +x; sh does not require it.
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      app:
        condition: service_healthy
    networks:
    - WeKnora-network
    restart: unless-stopped
    platform: linux/amd64
  app:
    image: ${ACR_IMAGE_PREFIX:-crpi-o8kn58wjl072akln.cn-hangzhou.personal.cr.aliyuncs.com/calb_ai/weknora}:app-${WEKNORA_VERSION:-v0.8.2}
    container_name: WeKnora-app
    ports:
    - ${APP_PORT:-8080}:8080
    volumes:
    - data-files:/data/files
    - docreader-tmp:/tmp/docreader:ro
    - ./config/config.yaml:/app/config/config.yaml
    - ./skills/preloaded:/app/skills/preloaded
    - /data/secrets:/data/secrets:ro
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
    - .env
    environment:
    - LOG_LEVEL=${LOG_LEVEL:-debug}
    - LOG_PATH=${LOG_PATH:-}
    - LOG_FORMAT=${LOG_FORMAT:-}
    - LLM_DEBUG_LOG=${LLM_DEBUG_LOG:-false}
    - GIN_MODE=${GIN_MODE:-release}
    - TZ=${TZ:-Asia/Shanghai}
    - WEKNORA_LANGUAGE=${WEKNORA_LANGUAGE:-}
    - WEKNORA_SANDBOX_DOCKER_ENABLED=${WEKNORA_SANDBOX_DOCKER_ENABLED:-false}
    - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
    - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}
    - COS_SECRET_ID=${COS_SECRET_ID:-}
    - COS_SECRET_KEY=${COS_SECRET_KEY:-}
    - COS_REGION=${COS_REGION:-}
    - COS_BUCKET_NAME=${COS_BUCKET_NAME:-}
    - COS_APP_ID=${COS_APP_ID:-}
    - COS_PATH_PREFIX=${COS_PATH_PREFIX:-}
    - COS_TEMP_BUCKET_NAME=${COS_TEMP_BUCKET_NAME:-}
    - COS_TEMP_REGION=${COS_TEMP_REGION:-}
    - COS_ENABLE_OLD_DOMAIN=${COS_ENABLE_OLD_DOMAIN:-}
    - FRONTEND_BASE_PATH=${FRONTEND_BASE_PATH:-}
    - JIEBA_DICT_DIR=${JIEBA_DICT_DIR:-/go/pkg/mod/github.com/yanyiwu/gojieba@v1.4.7/deps/cppjieba/dict}
    - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-false}
    - WEKNORA_AUTH_COMPLEX_PASSWORD_ENABLED=${WEKNORA_AUTH_COMPLEX_PASSWORD_ENABLED:-false}
    - WEKNORA_AUTH_DEFAULT_TENANT_MODE=${WEKNORA_AUTH_DEFAULT_TENANT_MODE:-create_personal}
    - WEKNORA_TENANT_SELF_SERVICE_CREATION_ENABLED=${WEKNORA_TENANT_SELF_SERVICE_CREATION_ENABLED:-true}
    - WEKNORA_TENANT_ENABLE_CROSS_TENANT_ACCESS=${WEKNORA_TENANT_ENABLE_CROSS_TENANT_ACCESS:-false}
